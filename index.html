<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигатор урока</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран блокировки -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Доступ закрыт</h2>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <p id="error-msg" style="color: red; display: none;">Неверный пароль!</p>
        </div>
    </div>

    <!-- Основной рабочий стол -->
    <div id="dashboard" style="display: none;">
        <header>
            <h1>Панель Учителя</h1>
            <button onclick="toggleTheme()" class="theme-btn">🌙 Тема</button>
        </header>
        
        <main class="grid-container">
            <!-- Виджет: Прямой эфир (Часы) -->
            <div class="widget timer-widget">
                <h3>Прямой эфир</h3>
                <div class="current-time" id="clock">00:00</div>
                <div class="lesson-info">
                    <p>Сейчас: <strong id="current-lesson">-</strong></p>
                    <p class="bell-countdown">До звонка: <span id="time-left">--:--</span></p>
                    <p class="next-lesson">Далее: <span id="next-lesson">-</span></p>
                </div>
            </div>

            <!-- Виджет: Кнопка открытия Патронажки -->
            <div class="widget" style="text-align: center; display: flex; flex-direction: column; justify-content: center;">
                <h3>Патронажка</h3>
                <p style="margin-bottom: 15px; color: #666; font-size: 0.9em;">Журнал отсутствующих и обедов</p>
                <button onclick="openModal('patronage-modal')" style="padding: 15px; font-size: 1.2em; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px;">📋 Открыть список</button>
            </div>

            <!-- Заглушка: Журнал оценок -->
            <div class="widget placeholder">
                <h3>Журнал оценок</h3>
                <p>Появится здесь позже</p>
            </div>

            <!-- Заглушка: Домашнее задание -->
            <div class="widget placeholder">
                <h3>Домашнее задание</h3>
                <p>Появится здесь позже</p>
            </div>
        </main>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО: ПАТРОНАЖКА -->
    <div id="patronage-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('patronage-modal')">&times;</span>
            <h2>Патронажка</h2>
            <div class="student-list" id="student-list">
                <!-- Сюда скриптом добавятся ученики -->
            </div>
            <button onclick="saveAttendance()" class="action-btn">Сохранить отсутствующих</button>
            
            <!-- Блок с иконками (появляется после сохранения) -->
            <div id="patronage-actions" style="display: none; margin-top: 15px; text-align: center;">
                <p id="attendance-status" style="font-weight: bold; margin-bottom: 15px;"></p>
                <div style="display: flex; justify-content: center; gap: 15px;">
                    <button onclick="copyForExcel()" class="icon-btn" title="Скопировать для таблицы">📋</button>
                    <a href="https://cloud.mail.ru/public/RaBf/yLkaMHw4H" target="_blank" class="icon-btn" title="Открыть школьный журнал">📗</a>
                </div>
                <p style="font-size: 0.8em; color: #888; margin-top: 10px;">Нажмите 📋, затем вставьте в колонку "Класс"</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
